plan_id: "plan_feature_orchestration_demo"
goal: "Implement a feature with orchestrator coordinating researcher, coder, tester, and reviewer agents"
stop_on_failure: true

workers:
  researcher:
    role: "researcher"
    name: "Architect/Researcher"
    model: "gemini-2.5-pro"
    effort: "high"
  coder:
    role: "coder"
    name: "Core Developer"
    model: "gemini-2.5-pro"
    effort: "high"
  tester:
    role: "tester"
    name: "QA Automation Specialist"
    model: "gemini-2.5-flash"
    effort: "medium"
  reviewer:
    role: "reviewer"
    name: "Lead Code Reviewer"
    model: "gemini-2.5-pro"
    effort: "high"

tasks:
  - id: "step_01_research"
    name: "Architecture & Requirement Analysis"
    role: "researcher"
    instruction: "Analyze the task requirements, identify files to modify or create, and outline the technical design."
    tags: ["planning", "research"]

  - id: "step_02_implementation"
    name: "Feature Implementation"
    role: "coder"
    instruction: "Implement the feature following the design and sub-spec. Ensure adherence to Agent.md code standards."
    depends_on: ["step_01_research"]
    tags: ["coding", "implementation"]
    spec:
      criticality: "high"
      risk_level: "low"
      blast_radius: "src/harness_agent/runner.py"
      risk_mitigation: "Ensure backward compatibility with existing command arguments"
      status: "approved"
      functions:
        - name: "build_command"
          signature: "def build_command(prompt: str, task: Optional[Task] = None) -> List[str]:"
          description: "Construct CLI arguments for agy invocation"
          return_type: "List[str]"
      test_cases:
        - id: "TC-01"
          description: "Verify happy path agy argument formatting"
          input_data:
            prompt: "hello"
      acceptance_criteria:
        - "Adhere to Black 100 char limit and Flake8 compliance"
        - "Achieve 100% pytest pass rate"


  - id: "step_03_testing"
    name: "Unit and Regression Testing"
    role: "tester"
    instruction: "Run conda run -n pytorch pytest. Write new unit tests if needed and ensure 100% pass rate."
    depends_on: ["step_02_implementation"]
    tags: ["testing", "qa"]
    checks:
      - type: "command_exit_zero"
        target: "conda run -n pytorch pytest"

  - id: "step_04_review"
    name: "Code Review & Quality Gate"
    role: "reviewer"
    instruction: "Review all code changes, verify git branch conventions, typing, docstrings, and approve merge readiness."
    depends_on: ["step_03_testing"]
    tags: ["review", "gate"]
