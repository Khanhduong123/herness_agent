suite_name: "Basic Agy Verification Suite"
description: "Tests basic agent execution and code inspection via agy CLI"

tasks:
  - id: "task_01_hello"
    name: "Agent Hello Test"
    prompt: "Print the exact text: 'Hello from agy harness!'"
    timeout_seconds: 60
    tags: ["smoke", "text_match"]
    checks:
      - type: "text_match"
        target: "Hello from agy harness!"

  - id: "task_02_python_version"
    name: "Python Environment Verification"
    prompt: "Write a short message explaining how to check python version in the terminal."
    timeout_seconds: 60
    tags: ["info"]
    checks:
      - type: "text_match"
        target: "python"
